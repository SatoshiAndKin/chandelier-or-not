name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-ci-test.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    uses: SatoshiAndKin/chandelier-or-not/.github/workflows/test-reviewed-linux.yml@9b2ce50dbd1badebd2dfc41609058dd6308ce8d4
