name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-ci-test.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  route:
    name: Select one lane before either suite runs
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    outputs:
      lane: ${{ steps.route.outputs.lane }}
    steps:
      - id: route
        shell: bash
        env:
          MAINTAINER: >-
            ${{ github.repository == 'SatoshiAndKin/chandelier-or-not' &&
                github.repository_id == '886484136' &&
                github.event.repository.private == false &&
                github.event.repository.fork == false &&
                github.actor == 'BlinkyStitt' &&
                github.triggering_actor == 'BlinkyStitt' &&
                github.workflow_ref == format('SatoshiAndKin/chandelier-or-not/.github/workflows/test.yml@{0}', github.ref) &&
                ((github.event_name == 'pull_request' &&
                  github.event.pull_request.user.id == 624221 &&
                  github.event.pull_request.head.repo.id == 886484136 &&
                  github.event.pull_request.base.repo.id == 886484136 &&
                  github.event.pull_request.base.ref == 'main' &&
                  github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number)) ||
                 (github.event_name == 'push' &&
                  github.ref == 'refs/heads/main' &&
                  github.ref_protected)) }}
          REVIEWED_SMALL: >-
            ${{ (github.event_name == 'pull_request' && github.sha == vars.SKI_PUBLIC_K3S_APPROVED_PR_MERGE_SHA) ||
                (github.event_name == 'push' && github.sha == vars.SKI_PUBLIC_K3S_APPROVED_MAIN_SHA) }}
        run: |
          case "$MAINTAINER:$REVIEWED_SMALL" in
            true:true) lane=native ;;
            true:false) lane=kvm ;;
            false:true|false:false) lane=hosted ;;
            *) exit 1 ;;
          esac
          printf 'lane=%s\n' "$lane" >> "$GITHUB_OUTPUT"

  foundry-hosted:
    name: Original hosted Foundry suite
    needs: route
    if: needs.route.outputs.lane == 'hosted'
    outputs:
      validated-sha: ${{ steps.result.outputs.sha }}
      validated-on: ${{ steps.result.outputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: default
      BASE_RPC_URL: https://mainnet.base.org
      # https://docs.neynar.com/docs/verifications-contract
      NN_VERIFICATIONS_ADDRESS: '0xdB1eCF22d195dF9e03688C33707b19C68BdEd142'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.10.0 # bundles Solar v0.3.0
      - run: forge fmt --check
      - run: forge build --sizes --no-lint
      - run: forge lint
      - name: Run tests and check gas snapshots
        run: forge snapshot --check -vvv

      - name: Record the required suite's exact source and environment
        id: result
        shell: bash
        working-directory: .
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          printf 'sha=%s\nenvironment=%s\n' "$GITHUB_SHA" "$RUNNER_ENVIRONMENT" >> "$GITHUB_OUTPUT"

  frontend-hosted:
    name: Original hosted frontend suite
    needs: route
    if: needs.route.outputs.lane == 'hosted'
    outputs:
      validated-sha: ${{ steps.result.outputs.sha }}
      validated-on: ${{ steps.result.outputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=2048
    defaults:
      run:
        working-directory: frames-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: frames-v2/.nvmrc
          cache: yarn
          cache-dependency-path: frames-v2/yarn.lock
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn lint
      - run: yarn tsc --noEmit
      - run: yarn build
      - name: Record the required suite's exact source and environment
        id: result
        shell: bash
        working-directory: .
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          printf 'sha=%s\nenvironment=%s\n' "$GITHUB_SHA" "$RUNNER_ENVIRONMENT" >> "$GITHUB_OUTPUT"

  linux:
    needs: route
    if: needs.route.outputs.lane == 'kvm'
    uses: SatoshiAndKin/chandelier-or-not/.github/workflows/test-reviewed-linux.yml@e2b3b25e048da752554c751d286f75785e56951e

  foundry-native:
    needs: route
    if: needs.route.outputs.lane == 'native'
    permissions:
      contents: read
    uses: SatoshiAndKin/chandelier-or-not/.github/workflows/test-reviewed-native.yml@4ccd3143280038d327590e3add899a618a15b7ba
    with:
      suite: foundry

  check:
    name: Foundry project
    needs: [route, linux, foundry-native, foundry-hosted]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Require that this suite passed on its selected runner
        shell: bash
        env:
          ROUTE: ${{ needs.route.result }}
          LANE: ${{ needs.route.outputs.lane }}
          KVM: ${{ needs.linux.result }}
          ON: ${{ needs.foundry-native.outputs.validated-on }}
          SHA: ${{ needs.foundry-native.outputs.validated-sha }}
          NATIVE: ${{ needs.foundry-native.result }}
          HOSTED_ON: ${{ needs.foundry-hosted.outputs.validated-on }}
          HOSTED_SHA: ${{ needs.foundry-hosted.outputs.validated-sha }}
          HOSTED: ${{ needs.foundry-hosted.result }}
        run: |
          test "$ROUTE" = success
          case "$LANE:$KVM:$NATIVE:$HOSTED" in
            kvm:success:skipped:skipped) ;;
            native:skipped:success:skipped) test "$ON:$SHA" = "self-hosted:$GITHUB_SHA" ;;
            hosted:skipped:skipped:success) test "$HOSTED_ON:$HOSTED_SHA" = "github-hosted:$GITHUB_SHA" ;;
            *) echo 'The selected full CI suite did not succeed'; exit 1 ;;
          esac

  frontend-native:
    needs: route
    if: needs.route.outputs.lane == 'native'
    permissions:
      contents: read
    uses: SatoshiAndKin/chandelier-or-not/.github/workflows/test-reviewed-native.yml@4ccd3143280038d327590e3add899a618a15b7ba
    with:
      suite: frontend

  frontend:
    name: Frontend lint, types and build
    needs: [route, linux, frontend-native, frontend-hosted]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Require that this suite passed on its selected runner
        shell: bash
        env:
          ROUTE: ${{ needs.route.result }}
          LANE: ${{ needs.route.outputs.lane }}
          KVM: ${{ needs.linux.result }}
          ON: ${{ needs.frontend-native.outputs.validated-on }}
          SHA: ${{ needs.frontend-native.outputs.validated-sha }}
          NATIVE: ${{ needs.frontend-native.result }}
          HOSTED_ON: ${{ needs.frontend-hosted.outputs.validated-on }}
          HOSTED_SHA: ${{ needs.frontend-hosted.outputs.validated-sha }}
          HOSTED: ${{ needs.frontend-hosted.result }}
        run: |
          test "$ROUTE" = success
          case "$LANE:$KVM:$NATIVE:$HOSTED" in
            kvm:success:skipped:skipped) ;;
            native:skipped:success:skipped) test "$ON:$SHA" = "self-hosted:$GITHUB_SHA" ;;
            hosted:skipped:skipped:success) test "$HOSTED_ON:$HOSTED_SHA" = "github-hosted:$GITHUB_SHA" ;;
            *) echo 'The selected full CI suite did not succeed'; exit 1 ;;
          esac
