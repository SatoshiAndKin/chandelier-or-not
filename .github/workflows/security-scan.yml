name: Security scan

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-security-scan.yml-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    uses: SatoshiAndKin/chandelier-or-not/.github/workflows/security-scan-reviewed-linux.yml@5ffcd90c5c8595b350337114f100c6e2c782b0ed

  scan:
    name: Scan dependencies, configuration, and secrets
    needs: linux
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Require the reviewed scan to pass
        shell: bash
        env:
          SCAN: ${{ needs.linux.result }}
        run: test "$SCAN" = success
